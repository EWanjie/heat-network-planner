# Приложение и база данных поднимаются одной командой: docker-compose up --build
# Спецификация Compose (без ключа version) поддерживается docker-compose 1.29.2.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/planner
      SPRING_DATASOURCE_USERNAME: planner
      SPRING_DATASOURCE_PASSWORD: planner
      # Память сервера 16 ГБ: расчёту хватает 6 ГБ, остальное — базе и системе.
      JAVA_OPTS: "-Xmx6g"
      APP_CALC_WORKERS: "1"
      APP_CALC_QUEUE: "50"
      APP_STORAGE_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads: