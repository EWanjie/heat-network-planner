spring.servlet.multipart.max-file-size=3GB
spring.servlet.multipart.max-request-size=3GB
spring.servlet.multipart.file-size-threshold=2KB

# База данных: по умолчанию файл H2 рядом с приложением; в docker-compose подменяется на PostgreSQL через переменные окружения
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:h2:file:./data/planner;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Расчёт: число одновременных расчётов (каждый занимает до ~2 ГБ памяти), длина очереди, каталог временных файлов.
app.calc.workers=1
app.calc.queue=50
app.storage.dir=

# Документация API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs